@if (users.user(); as user) {
  <div class="header-user">
    <div class="user-identity">
      <span class="user-name">{{ user.name || user.email }}</span>
      <p-tag [rounded]="true" [value]="user.role" severity="secondary" />
    </div>
    <p-menu
      #userMenu
      [model]="menu()"
      [popup]="true"
      appendTo="body"
      id="account-menu"
    />
    <p-button
      (onClick)="userMenu.toggle($event)"
      [disabled]="loading()"
      [loading]="loading()"
      [rounded]="true"
      [text]="true"
      aria-controls="account-menu"
      aria-haspopup="menu"
      ariaLabel="Open user menu"
      icon="pi pi-chevron-down"
      severity="secondary"
    />
  </div>
}
