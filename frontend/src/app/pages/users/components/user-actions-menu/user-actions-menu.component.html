<p-button
  (onClick)="rowMenu.toggle($event)"
  [ariaLabel]="'Actions for ' + user().email"
  [disabled]="disabled()"
  [text]="true"
  icon="pi pi-ellipsis-h"
  severity="secondary"
/>
<p-menu #rowMenu [model]="menuItems()" [popup]="true" appendTo="body" />
<p-dialog
  (visibleChange)="!$event && closeDialog()"
  [closable]="true"
  [closeOnEscape]="true"
  [header]="actionTitle()"
  [modal]="true"
  [style]="{ width: '440px', maxWidth: '95vw' }"
  [visible]="!!activeActionType()"
>
  <p class="dialog-description">{{ user().email }}</p>
  @if (activeActionType() === 'changeRole') {
    <div [formGroup]="roleForm" class="form-field">
      <label [for]="'user-role-' + user().email">Role</label>
      <p-select
        [fluid]="true"
        [inputId]="'user-role-' + user().email"
        [options]="rolesOptions"
        appendTo="body"
        formControlName="role"
        optionLabel="label"
        optionValue="value"
      />
    </div>
  } @else {
    <p>{{ actionMessage() }}</p>
  }
  <div class="dialog-actions">
    <p-button
      (onClick)="closeDialog()"
      [text]="true"
      label="Cancel"
      severity="secondary"
    />
    <p-button
      (onClick)="onConfirmAction()"
      [label]="actionLabel()"
      [severity]="activeActionType() === 'deleteInvitation' || activeActionType() === 'deleteUser' ? 'danger' : 'primary'"
    />
  </div>
</p-dialog>
